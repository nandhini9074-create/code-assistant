# ==============================================================================
# Alembic Configuration — Code Explorer
# ==============================================================================

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision file timestamps
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set this to True to enable output buffering
# This is especially useful when doing offline migrations
output_encoding = utf-8

# SQLAlchemy connection URL — overridden by env.py reading from app config
# Do not put real credentials here; env.py reads from DATABASE_URL env var
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/code_explorer

[post_write_hooks]
# Hooks to run after generating migrations
# Uncomment to auto-format with ruff:
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
