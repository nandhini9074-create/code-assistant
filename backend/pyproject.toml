[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "code-explorer"
version = "0.1.0"
description = "AI-Powered Code Repository Semantic Search & AI Analysis System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── Ruff (linter + formatter) ────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "ANN", # flake8-annotations (partial)
  "S",   # flake8-bandit (security)
  "T20", # flake8-print
]
ignore = [
  "ANN101", # missing type for self
  "ANN102", # missing type for cls
  "ANN401", # dynamically typed expressions (Any) are ok
  "S101",   # assert statements ok in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "T20"]
"migrations/**" = ["ANN", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
markers = [
  "unit: Unit tests (no external services)",
  "integration: Integration tests (requires PostgreSQL, Qdrant, Redis)",
  "e2e: End-to-end tests (requires all services)",
  "slow: Slow-running tests",
]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
show_error_codes = true
exclude = ["migrations/", "tests/"]
